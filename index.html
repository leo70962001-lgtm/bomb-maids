<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a1b30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOMB MAIDS">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>炸彈女僕 BOMB MAIDS</title>
<meta name="description" content="炸彈超人玩法 × 女僕咖啡廳的點陣圖遊戲">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    --plum: #2a1b30;
    --plum-deep: #1a1020;
    --milk: #ffd9e5;
    --lace: #fff8fc;
    --cherry: #ec3d5f;
    --gold: #ffd23f;
    --ink: #cdbfd8;
    --pixel: "DotGothic16", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--plum);
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255, 217, 229, 0.07) 1.5px, transparent 2px),
      radial-gradient(circle at 0 0, rgba(255, 217, 229, 0.05) 1px, transparent 1.5px);
    background-size: 16px 16px, 16px 16px;
    background-position: 0 0, 8px 8px;
    color: var(--ink);
    font-family: var(--pixel);
    display: grid;
    grid-template-rows: 1fr auto;
    height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #holder {
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 12px;
  }
  .apron {
    position: relative;
    padding: 8px;
    background: var(--plum-deep);
    border-radius: 4px;
    box-shadow: 0 0 0 3px var(--lace), 0 0 0 6px var(--plum-deep), 0 16px 36px rgba(0, 0, 0, 0.5);
  }
  /* lace scallops along the top and bottom of the screen frame */
  .apron::before, .apron::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 4px;
    height: 7px;
    background-image: radial-gradient(circle at 5px 7px, var(--lace) 4.5px, transparent 5px);
    background-size: 10px 7px;
    background-repeat: repeat-x;
    pointer-events: none;
  }
  .apron::before { top: -10px; }
  .apron::after { bottom: -10px; transform: scaleY(-1); }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
    background: var(--plum);
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--gold); }
  /* full-resolution illustrations laid over the pixel canvas (see E.art) */
  .screen { position: relative; }
  #art { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #art .art { position: absolute; display: none; background-repeat: no-repeat; }
  .keys {
    margin: 0;
    padding: 6px 12px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    justify-content: center;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .keys span { white-space: nowrap; }
  kbd {
    font-family: var(--pixel);
    font-size: 12px;
    color: var(--plum);
    background: var(--lace);
    border-radius: 3px;
    box-shadow: inset 0 -3px 0 var(--milk);
    padding: 1px 6px 3px;
    margin-right: 4px;
  }
  /* touch controls */
  #pad { display: none; }
  body.touch .keys { display: none; }
  @media (orientation: portrait) {
    body.touch #holder { place-items: start center; padding-top: 58px; }
    body.touch #pad { align-self: center; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  }
  body.touch #pad {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 18px calc(12px + env(safe-area-inset-bottom));
    gap: 12px;
  }
  #dpad {
    --k: 44px; /* one key; the pad is three of them across */
    position: relative;
    width: calc(var(--k) * 3);
    height: calc(var(--k) * 3);
    border-radius: 50%;
    background: rgba(42, 27, 48, 0.3);
    box-shadow: inset 0 0 0 2px rgba(255, 248, 252, 0.18);
    touch-action: none;
  }
  #dpad i {
    position: absolute;
    width: var(--k);
    height: var(--k);
    background: var(--lace);
    border-radius: 6px;
    box-shadow: inset 0 -4px 0 var(--milk), 0 0 0 2px rgba(42, 27, 48, 0.5);
  }
  #dpad i::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    border: 8px solid transparent;
    transform: translate(-50%, -50%);
  }
  #dpad .u { left: var(--k); top: 0; }
  #dpad .d { left: var(--k); bottom: 0; }
  #dpad .l { left: 0; top: var(--k); }
  #dpad .r { right: 0; top: var(--k); }
  #dpad .u::after { border-bottom-color: var(--plum); margin-top: -4px; }
  #dpad .d::after { border-top-color: var(--plum); margin-top: 4px; }
  #dpad .l::after { border-right-color: var(--plum); margin-left: -4px; }
  #dpad .r::after { border-left-color: var(--plum); margin-left: 4px; }
  #dpad[data-dir="up"] .u, #dpad[data-dir="down"] .d, #dpad[data-dir="left"] .l, #dpad[data-dir="right"] .r { background: var(--milk); box-shadow: none; transform: translateY(2px); }
  .btns { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 10px 14px; align-items: center; touch-action: none; }
  .btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 0;
    font-family: var(--pixel);
    font-size: 15px;
    color: #fff;
    background: var(--cherry);
    box-shadow: inset 0 -5px 0 #a51f40;
    touch-action: none;
    line-height: 1.1;
  }
  .btn small { display: block; font-size: 11px; opacity: 0.9; }
  .btn.b { background: #6b5a8e; box-shadow: inset 0 -5px 0 #463a5e; grid-row: 2; grid-column: 1; }
  .btn.a { grid-row: 1; grid-column: 2; }
  .btn.start { width: 54px; height: 26px; border-radius: 13px; font-size: 11px; background: #4a3d66; box-shadow: inset 0 -3px 0 #2e2440; grid-row: 2; grid-column: 2; justify-self: center; }
  .btn.on { transform: translateY(2px); box-shadow: none; filter: brightness(1.15); }
  /* Sideways on a phone: each thumb gets a gutter of its own beside the screen, so the pad never sits on the game.
     The same set of rules is repeated below for body.rot, the page turned sideways inside an upright phone. */
  @media (orientation: landscape) and (max-height: 520px) {
    body.touch { grid-template-rows: 1fr; }
    body.touch #holder { padding: 6px 130px; }
    body.touch #pad {
      position: fixed;
      inset: auto 0 0 0;
      pointer-events: none;
      align-items: flex-end;
      padding: 0 calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    }
    body.touch #dpad, body.touch .btns { pointer-events: auto; opacity: 0.94; }
    body.touch #dpad { --k: 38px; }
    body.touch .btns { gap: 8px 10px; }
    body.touch .btn { width: 56px; height: 56px; }
    body.touch .btn.start { width: 48px; }
  }
  /* full screen toggle and the hint shown where the browser cannot go full screen */
  #fullscreen {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    right: calc(8px + env(safe-area-inset-right));
    z-index: 5;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    color: var(--lace);
    background: rgba(255, 248, 252, 0.12);
    cursor: pointer;
    touch-action: manipulation;
  }
  #fullscreen:hover { background: rgba(255, 248, 252, 0.22); }
  /* play sideways: a phone held upright whose browser will not turn can turn the game (body.rot) instead */
  #rotate {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    right: calc(58px + env(safe-area-inset-right));
    z-index: 5;
    width: 42px;
    height: 42px;
    display: none;
    place-items: center;
    border: 0;
    border-radius: 8px;
    color: var(--lace);
    background: rgba(255, 248, 252, 0.12);
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (orientation: portrait) { body.touch #rotate { display: grid; } }
  body.rot #rotate { display: grid; background: rgba(255, 159, 187, 0.35); }
  body.rot {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vh;
    width: 100dvh;
    height: 100vw;
    height: 100dvw;
    transform-origin: 0 0;
    transform: translateX(100vw) rotate(90deg);
  }
  /* turned sideways the page is a landscape one: the same layout as a phone held that way. The page's own edges are
     turned too, so the safe areas come in rotated: its bottom is the phone's left, its left is the phone's top. */
  body.rot.touch { grid-template-rows: 1fr; }
  body.rot.touch #holder { place-items: center; padding: 6px 130px; }
  body.rot.touch #pad {
    position: fixed;
    inset: auto 0 0 0;
    pointer-events: none;
    align-self: auto;
    align-items: flex-end;
    padding: 0 calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)) calc(8px + env(safe-area-inset-top));
  }
  body.rot.touch #dpad, body.rot.touch .btns { pointer-events: auto; opacity: 0.94; }
  body.rot.touch #dpad { --k: 38px; }
  body.rot.touch .btns { gap: 8px 10px; }
  body.rot.touch .btn { width: 56px; height: 56px; }
  body.rot.touch .btn.start { width: 48px; }
  #fullscreen:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold); }
  #fullscreen .exit, #fullscreen.is-full .enter { display: none; }
  #fullscreen.is-full .exit { display: inline; }
  #toast {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    width: max-content;
    max-width: min(92vw, 440px);
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--lace);
    background: var(--plum-deep);
    border: 2px solid var(--lace);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.on, #dpad i { transform: none !important; }
  }
</style>

<div id="holder">
  <div class="apron">
    <div class="screen">
    <canvas id="screen" tabindex="0" data-i18n-label="炸彈女僕 遊戲畫面，使用方向鍵移動、Z 放炸彈、X 使用特技" aria-label="炸彈女僕 遊戲畫面，使用方向鍵移動、Z 放炸彈、X 使用特技"></canvas>
    <div id="art" aria-hidden="true"></div>
    </div>
  </div>
</div>

<p class="keys">
  <span><kbd data-i18n="方向鍵">方向鍵</kbd><span data-i18n="移動">移動</span></span>
  <span><kbd>Z</kbd><span data-i18n="放炸彈 / 決定">放炸彈 / 決定</span></span>
  <span><kbd>X</kbd><span data-i18n="特技 / 返回">特技 / 返回</span></span>
  <span><kbd>Esc</kbd><span data-i18n="暫停">暫停</span></span>
  <span data-i18n="房間裡可以直接用滑鼠點女僕和家具">房間裡可以直接用滑鼠點女僕和家具</span>
  <span data-i18n="支援手把・雙人對決 1P WASD+F/G、2P 方向鍵+K/L">支援手把・雙人對決 1P WASD+F/G、2P 方向鍵+K/L</span>
</p>

<button id="fullscreen" type="button" data-i18n-label="全螢幕" aria-label="全螢幕">
  <svg class="enter" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
  <svg class="exit" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
</button>
<button id="rotate" type="button" data-i18n-label="橫向遊玩" aria-label="橫向遊玩">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 3.5h5.5a4 4 0 0 1 4 4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 5.5l2 2.2 2.2-2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
</button>
<div id="toast" role="status" hidden></div>

<div id="pad" aria-hidden="true">
  <div id="dpad"><i class="u"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div class="btns">
    <button class="btn b" data-btn="b">B<small data-i18n="特技">特技</small></button>
    <button class="btn a" data-btn="a">A<small data-i18n="炸彈">炸彈</small></button>
    <button class="btn start" data-btn="start" data-i18n="暫停">暫停</button>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/data.js"></script>

<script src="js/lang-ui.js"></script>
<script src="js/lang-data.js"></script>

</html>
